<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Event Ticketing System</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Fill in the details to register</p>

            <form id="registerForm">

                <!-- Name -->
                <div class="form-group">
                    <label class="form-label">
                        Name <span class="required">*</span>
                    </label>
                    <input type="text" id="name" class="form-input" placeholder="Dark Samurai" required>
                    <span class="error-text" id="nameError"></span>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label class="form-label">
                        Email? <span class="required">*</span>
                    </label>
                    <input type="email" id="email" class="form-input" placeholder="your.email@gmail.com" required>
                    <span class="error-text" id="emailError"></span>
                    <small class="form-hint">Must be a Gmail address</small>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label class="form-label">
                        Phone Number <span class="required">*</span>
                    </label>
                    <input type="tel" id="phone" class="form-input" placeholder="9876543210" maxlength="10" required>
                    <span class="error-text" id="phoneError"></span>
                    <small class="form-hint">10 digits only</small>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label">
                        Password <span class="required">*</span>
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Create password" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('password')"
                            title="Show/Hide Password">
                            👀
                        </button>
                    </div>
                    <span class="error-text" id="passwordError"></span>
                    <small class="form-hint">8-12 chars, 1 uppercase, 1 special character</small>
                </div>

                <!-- Role -->
                <div class="form-group">
                    <label class="form-label">
                        Register As <span class="required">*</span>
                    </label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="role" value="CUSTOMER" checked>
                            Customer
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="role" value="ORGANIZER">
                            Organizer
                        </label>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
                    Register
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>

    <script>
        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }
    </script>
</body>

</html>
