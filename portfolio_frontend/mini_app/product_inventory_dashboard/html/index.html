<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Product Inventory Dashboard</h1>
    </header>

    <!-- Loading Message - shown while API fetches data -->
    <div id="loading-message">
        <p>Loading products...</p>
    </div>

    <!-- Controls Section -->
    <section id="controls">
        <input type="text" id="search-input" placeholder="Search by product name...">

        <select id="category-filter">
            <option value="all">All Categories</option>
            <option value="electronics">Electronics</option>
            <option value="clothing">Clothing</option>
            <option value="books">Books</option>
            <option value="accessories">Accessories</option>
        </select>

        <label>
            <input type="checkbox" id="low-stock-filter"> Low Stock (less than 5)
        </label>

        <select id="sort-option">
            <option value="default">Sort By</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="name-az">Name: A to Z</option>
            <option value="name-za">Name: Z to A</option>
        </select>
    </section>

    <!-- Analytics Section -->
    <section id="analytics">
        <div class="analytics-card">
            <h3>Total Products</h3>
            <p id="total-products">0</p>
        </div>
        <div class="analytics-card">
            <h3>Total Inventory Value</h3>
            <p id="total-value">₹0</p>
        </div>
        <div class="analytics-card">
            <h3>Out of Stock</h3>
            <p id="out-of-stock">0</p>
        </div>
    </section>

    <!-- Product Grid -->
    <section id="product-grid">
        <!-- Products will be rendered here by JavaScript -->
    </section>

    <!-- Add Product Form -->
    <section id="add-product-section">
        <h2>Add New Product</h2>
        <form id="add-product-form">
            <div class="form-group">
                <label for="product-name">Product Name</label>
                <input type="text" id="product-name" placeholder="Enter product name">
            </div>
            <div class="form-group">
                <label for="product-price">Price (₹)</label>
                <input type="number" id="product-price" placeholder="Enter price">
            </div>
            <div class="form-group">
                <label for="product-stock">Stock Quantity</label>
                <input type="number" id="product-stock" placeholder="Enter stock">
            </div>
            <div class="form-group">
                <label for="product-category">Category</label>
                <select id="product-category">
                    <option value="">Select Category</option>
                    <option value="electronics">Electronics</option>
                    <option value="clothing">Clothing</option>
                    <option value="books">Books</option>
                    <option value="accessories">Accessories</option>
                </select>
            </div>
            <button type="submit">Add Product</button>
        </form>
    </section>

    <script src="../js/api.js"></script>
    <script src="../js/script.js"></script>
</body>

</html>
