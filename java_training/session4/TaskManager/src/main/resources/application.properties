spring.application.name=TaskManager

# H2 DATABASE
# This is the address of the H2 database
# mem:tododb means store in memory, and database name is tododb
spring.datasource.url=jdbc:h2:mem:tododb
# H2's driver class
spring.datasource.driver-class-name=org.h2.Driver
# Username and password to access the database
spring.datasource.username=su
spring.datasource.password=

# JPA CONFIGURATION
spring.jpa.hibernate.ddl-auto=create-drop
# To show the SQL queries generated by JPA in console
spring.jpa.show-sql=true
# Beautify SQL
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 CONSOLE
# Enable the H2 web console
spring.h2.console.enabled=true
# URL to access H2 console
# Open: http://localhost:8080/h2-console
spring.h2.console.path=/h2-console
