<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CircleUp</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Join CircleUp</h1>
                <p>Create your account and start connecting</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name <span class="required">*</span></label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        class="form-control" 
                        placeholder="Enter your full name"
                        required
                    >
                    <span class="error-text" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address  <span class="required">*</span></label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="Enter your email"
                        required
                    >
                    <span class="error-text" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="phone_number">Phone Number  <span class="required">*</span></label>
                    <input 
                        type="tel" 
                        id="phone_number" 
                        name="phone_number" 
                        class="form-control" 
                        placeholder="Enter your phone number"
                        required
                    >
                    <span class="error-text" id="phoneError"></span>
                </div>

                <div class="form-group">
                    <label for="city">City</label>

                    <select
                        id="city"
                        name="city"
                        class="form-control"
                    >
                        <option value="">Select your city</option>
                        <option value="Bilaspur">Bilaspur</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Bengaluru">Bengaluru</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Hyderabad">Hyderabad</option>
                        <option value="Kolkata">Kolkata</option>
                        <option value="Pune">Pune</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Password  <span class="required">*</span></label>
                    <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="Create a password (min 8 characters)"
                        required
                    >
                    <button type="button" class="password-toggle-btn" onclick="togglePassword('password')"
                        title="Show/Hide Password">
                        👀
                    </button>
                    </div>
                    <span class="error-text" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password  <span class="required">*</span></label>
                    <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        class="form-control" 
                        placeholder="Confirm your password"
                        required
                    >
                    <button type="button" class="password-toggle-btn" onclick="togglePassword('confirm_password')"
                        title="Show/Hide Password">
                        👀
                    </button>
                    </div>
                    <span class="error-text" id="confirmPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea 
                        id="bio" 
                        name="bio" 
                        class="form-control" 
                        placeholder="Tell us about yourself"
                        rows="3"
                    ></textarea>
                    <span class="error-text" id="bioError"></span>
                </div>

                <button type="submit" class="auth-btn">
                    Create Account
                </button>
            </form>

            <div class="auth-links">
                <p>Already have an account? <a href="login.html">Sign in here</a></p>
                <p><a href="../index.html">← Back to Home</a></p>
            </div>
        </div>
    </div>
    
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }
    </script>
</body>
</html>
