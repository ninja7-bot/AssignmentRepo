<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Activity - CircleUp</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/activities.css">
</head>
<body>
    <!--Nav Bar-->
    <header class="header">
        <nav class="nav">
            <a href="/" class="logo">CircleUp</a>
            <ul class="nav-links"></ul>
        </nav>
    </header>

    <!--Create Activity Form-->
    <main class="main">
        <div class="container">
            <section class="page-header">
                <h1>Create New Activity</h1>
                <p>Organize an activity and invite others to join</p>
            </section>

            <section class="create-activity-section">
                <form id="create-activity-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="title">Activity Title <span class="required">*</span></label>
                            <input 
                                type="text" 
                                id="title" 
                                name="title" 
                                class="form-control" 
                                placeholder="e.g. Cricket Match"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="category">Category <span class="required">*</span></label>
                            <select id="category" name="category" class="form-control" required>
                                <option value="">Select Category</option>
                                <option value="sports">Sports</option>
                                <option value="social">Social</option>
                                <option value="education">Education</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="travel">Travel</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="location">Location <span class="required">*</span></label>
                            <select
                                id="location"
                                name="location"
                                class="form-control"
                                required
                            >
                                <option value="">Select your city</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="activity_date">Date & Time <span class="required">*</span></label>
                            <input 
                                type="datetime-local" 
                                id="activity_date" 
                                name="activity_date" 
                                class="form-control" 
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="max_participants">Maximum Participants <span class="required">*</span></label>
                            <input 
                                type="number" 
                                id="max_participants" 
                                name="max_participants" 
                                class="form-control" 
                                min="1"
                                max="100"
                                placeholder="e.g. 10"
                                required
                            >
                        </div>

                        <div class="form-group form-group-full">
                            <label for="description">Description <span class="required">*</span></label>
                            <textarea 
                                id="description" 
                                name="description" 
                                class="form-control" 
                                rows="4"
                                placeholder="Describe your activity, what participants should bring, skill level, etc."
                                required
                            ></textarea>
                        </div>
                    </div>

                    <div class="form-actions mt-2">
                        <button type="submit" class="btn btn-primary">Create Activity</button>
                        <a href="discover.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/activities.js"></script>
</body>
</html>
